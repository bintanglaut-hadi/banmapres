<!DOCTYPE html>

```
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#198754">

<title>Aplikasi Google Apps Script</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
    }

    body {
        position: fixed;
        inset: 0;
    }

    .app-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #ffffff;
    }

    iframe {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 100%;
        border: 0;
        margin: 0;
        padding: 0;
    }

    /* Khusus perangkat mobile */
    @media (max-width: 768px) {
        .app-container {
            width: 100vw;
            height: 100dvh;
        }

        iframe {
            width: 100vw;
            height: 100dvh;
        }
    }
</style>
```

</head>

<body>

```
<div class="app-container">

    <iframe
        src="https://script.google.com/macros/s/AKfycbzdMc8uQtKxp4VxNiXxbzpLQ1flL_7v76dFHheI1ExmQvGz7c0GPxDxImLzl55zTb4H/exec"
        title="Aplikasi Google Apps Script"
        allow="clipboard-read; clipboard-write; fullscreen"
        allowfullscreen>

</div>

</body>
</html>
