<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web Google Apps Script</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://script.google.com/macros/s/AKfycbzdMc8uQtKxp4VxNiXxbzpLQ1flL_7v76dFHheI1ExmQvGz7c0GPxDxImLzl55zTb4H/exec" 
        allow="camera; microphone; geolocation; clipboard-read; clipboard-write" 
        allowfullscreen>
    </iframe>
</body>
</html>
